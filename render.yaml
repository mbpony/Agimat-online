# Render Blueprint — deploy AGIMAT ONLINE with one click
# (Render dashboard → New + → Blueprint → pick this repo)
services:
  - type: web
    name: agimat-online
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Cloud saves (Upstash Redis) — set BOTH in the Render dashboard:
      #   Environment → Add Environment Variable
      # Get them free at https://console.upstash.com (Redis → your db → REST API)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
